spring.application.name=nurbolat-djumadilov-student-api
app.version=1.1
server.port=8080

# DB settings come from environment variables (docker-compose / .env)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studentdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health,info
